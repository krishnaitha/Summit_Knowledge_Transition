services:

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: next_elevate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d next_elevate"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/next_elevate
    depends_on:
      db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost:localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  app:
    build:
      context: .
      target: runner
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/next_elevate
      DATABASE_SSL: disable
      AUTH_PROVIDER: oidc
      OIDC_PROVIDER_ID: keycloak
      OIDC_CLIENT_ID: next-elevate-app
      OIDC_CLIENT_SECRET: next-elevate-secret
      OIDC_ISSUER: http://localhost:8080/realms/next-elevate
      OIDC_DISPLAY_NAME: Next Elevate
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/next_elevate
      DATABASE_SSL: disable
      INTERNAL_APP_URL: http://app:3000
      AUTH_PROVIDER: oidc
      OIDC_PROVIDER_ID: keycloak
      OIDC_CLIENT_ID: next-elevate-app
      OIDC_CLIENT_SECRET: next-elevate-secret
      OIDC_ISSUER: http://localhost:8080/realms/next-elevate
      OIDC_DISPLAY_NAME: Next Elevate
    volumes:
      - uploads_data:/app/public/uploads
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # One-off helper — not started by default
  # Elevate the Keycloak demo user to admin (run after first login):
  #   docker compose run --rm elevate-demo-user
  # ---------------------------------------------------------------------------
  elevate-demo-user:
    profiles: [tools]
    image: postgres:17-alpine
    environment:
      PGPASSWORD: postgres
    command: >
      psql -h db -U postgres -d next_elevate
      -c "UPDATE users SET role = 'admin' WHERE email = 'demo@nexturn.com' AND auth_provider = 'keycloak';"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
